<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>错一次，就真的翻不了盘吗？｜沉没成本</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0e1116; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #root [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="60">
      <div id="s1" data-composition-id="s1-hook" data-composition-src="compositions/scene-1-hook.html" data-start="0" data-duration="12" data-track-index="0" data-width="1280" data-height="720"></div>
      <div id="s2" data-composition-id="s2-anchor" data-composition-src="compositions/scene-2-anchor.html" data-start="12" data-duration="13" data-track-index="1" data-width="1280" data-height="720"></div>
      <div id="s3" data-composition-id="s3-debate" data-composition-src="compositions/scene-3-debate.html" data-start="25" data-duration="20" data-track-index="2" data-width="1280" data-height="720"></div>
      <div id="s4" data-composition-id="s4-ending" data-composition-src="compositions/scene-4-ending.html" data-start="45" data-duration="15" data-track-index="3" data-width="1280" data-height="720"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
