<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-2"></head><body><template>
<style>
#root{position:absolute;inset:0;overflow:hidden;background:#0e1418;color:#f4f6f9;font-family:system-ui,sans-serif;}
.text{position:absolute;right:80px;top:120px;width:450px;text-align:right;}
.tag{font-size:16px;letter-spacing:4px;color:#63a4ff;opacity:0;}
.h{font-size:42px;font-weight:800;margin-top:12px;opacity:0;line-height:1.3;}
.p{font-size:22px;color:#c8d0db;margin-top:16px;line-height:1.6;opacity:0;}
.scene{position:absolute;left:80px;bottom:60px;width:400px;height:500px;}
.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:200px;background:rgba(99,164,255,0.15);border:3px solid #63a4ff;border-radius:6px 6px 0 0;opacity:0;position:relative;}
.door::after{content:'';position:absolute;right:12px;top:50%;width:8px;height:8px;background:#63a4ff;border-radius:50%;}
.light{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:150px;height:200px;background:radial-gradient(ellipse at top,rgba(99,164,255,0.3),transparent 70%);opacity:0;}
.person{position:absolute;bottom:0;left:80px;opacity:0;}
.person::before{content:'';position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#4a6a8a;}
.person::after{content:'';position:absolute;top:0;left:0;width:30px;height:80px;background:#4a6a8a;border-radius:4px 4px 0 0;}
</style>
<div id="root" data-composition-id="s6-con" data-width="1280" data-height="720">
<div class="text">
<div class="tag" id="tag">反方</div>
<div class="h" id="h1">沉没成本，不是成本</div>
<div class="p" id="p1">放下包袱，推开那扇门，前面是属于你的未来</div>
</div>
<div class="scene">
<div class="light" id="light"></div>
<div class="door" id="door"></div>
<div class="person" id="person"></div>
</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#tag",{opacity:0,x:20},{opacity:1,x:0,duration:0.4},0.1);
tl.fromTo("#h1",{opacity:0,y:20},{opacity:1,y:0,duration:0.5,ease:"power3.out"},0.4);
tl.fromTo("#p1",{opacity:0,y:15},{opacity:1,y:0,duration:0.4},0.9);
tl.fromTo("#light",{opacity:0,scaleY:0,transformOrigin:"bottom"},{opacity:1,scaleY:1,transformOrigin:"bottom",duration:0.8,ease:"power2.out"},0.6);
tl.fromTo("#door",{opacity:0,scale:0.8},{opacity:1,scale:1,duration:0.6,ease:"back.out(1.6)"},1.0);
tl.fromTo("#person",{opacity:0,x:-20},{opacity:1,x:0,duration:0.6},1.3);
window.__timelines["s6-con"]=tl;
</script>
</template></body></html>
